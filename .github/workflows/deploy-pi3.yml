name: Deploy glance.yml to pi3

on:
  push:
    # Tag format: YYYYMMDD-HHMM, e.g. 20260809-1503
    tags:
      - '20[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]'
  workflow_dispatch: {}

concurrency:
  group: deploy-pi3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Diagnose tailnet connectivity
        run: |
          tailscale status
          echo "--- ping ---"
          tailscale ping -c 3 100.92.199.101 || true
          echo "--- netcheck ---"
          tailscale netcheck || true

      - name: Deploy config and restart glance
        env:
          SSH_KEY: ${{ secrets.PI3_DEPLOY_SSH_KEY }}
          SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp $SSH_OPTS -i ~/.ssh/deploy_key glance.yml root@100.92.199.101:/opt/glance/glance.yml
          ssh $SSH_OPTS -i ~/.ssh/deploy_key root@100.92.199.101 'systemctl restart glance && systemctl is-active glance'
