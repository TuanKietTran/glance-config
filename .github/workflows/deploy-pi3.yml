name: Deploy glance.yml to pi3

on:
  push:
    # Tag format: YYYYMMDD-HHMM, e.g. 20260809-1503
    tags:
      - '20[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]'
  workflow_dispatch: {}

concurrency:
  group: deploy-pi3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Diagnose tailnet connectivity
        run: |
          tailscale status
          echo "--- ping ---"
          tailscale ping -c 3 100.92.199.101 || true
          echo "--- netcheck ---"
          tailscale netcheck || true

      - name: Verify SSH is authorized by tailnet policy
        env:
          SSH_KEY: ${{ secrets.PI3_DEPLOY_SSH_KEY }}
          SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
        run: |
          # pi3 runs Tailscale SSH, so port 22 is authorized by the tailnet ACL
          # rather than by deploy_key. When the ACL's ssh block does not cover
          # this runner, the deploy dies mid-copy on a bare exit 255 that reads
          # like an SSH fault. Probe it first and say what is actually wrong.
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "runner tags: $(tailscale status --json | jq -r '.Self.Tags // ["<none>"] | join(",")')"
          if ! out=$(ssh $SSH_OPTS -i ~/.ssh/deploy_key root@100.92.199.101 true 2>&1); then
            echo "$out"
            case "$out" in
              *"tailnet policy does not permit"*)
                echo "::error::Tailnet ACL refused SSH. Add an \`ssh\` rule granting this runner's tag as src, pi3 as dst, and root in users. Rotating TS_AUTHKEY will not help - the runner joins the tailnet fine." ;;
              *)
                echo "::error::Could not open an SSH session to pi3. See the message above." ;;
            esac
            exit 1
          fi
          echo "ssh to pi3 authorized"

      - name: Deploy config, modules, and manager
        env:
          SSH_KEY: ${{ secrets.PI3_DEPLOY_SSH_KEY }}
          SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH="ssh $SSH_OPTS -i ~/.ssh/deploy_key root@100.92.199.101"
          SCP="scp $SSH_OPTS -i ~/.ssh/deploy_key"
          $SSH 'install -d /opt/glance/modules /opt/glance/module-manager && rm -f /opt/glance/modules/*.yml'
          $SCP glance.yml root@100.92.199.101:/opt/glance/glance.base.yml
          # modules/ is optional and git does not track empty directories, so
          # an unmatched glob would otherwise reach scp as a literal path and
          # fail the deploy under `bash -e`.
          shopt -s nullglob
          module_files=(modules/*.yml)
          shopt -u nullglob
          if [ ${#module_files[@]} -gt 0 ]; then
            echo "copying ${#module_files[@]} module(s): ${module_files[*]}"
            $SCP "${module_files[@]}" root@100.92.199.101:/opt/glance/modules/
          else
            echo "no modules to copy; /opt/glance/modules left empty"
          fi
          $SCP module-manager/server.py root@100.92.199.101:/opt/glance/module-manager/server.py
          $SCP module-manager/glance-module-manager.service root@100.92.199.101:/etc/systemd/system/glance-module-manager.service
          $SSH '/usr/bin/python3 /opt/glance/module-manager/server.py --reconcile && systemctl daemon-reload && systemctl enable --now glance-module-manager && tailscale serve --bg --set-path /config http://127.0.0.1:8081 && systemctl restart glance && systemctl is-active glance glance-module-manager'
