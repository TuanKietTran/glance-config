document:
  head: |
    <style>
      #manual-reload-btn {
        background: var(--color-primary);
        color: #fff;
        border: none;
        border-radius: 0.4rem;
        padding: 0.2rem 0.6rem;
        font-size: 0.8rem;
        cursor: pointer;
        margin-left: auto;
      }
      #manual-reload-btn:hover { opacity: 0.85; }
      #last-updated-label {
        font-size: 0.95rem;
        opacity: 0.75;
        white-space: nowrap;
        align-self: center;
      }
      /* Only the VOZ tab content scrolls -- the header (tabs, reload
         button, last-updated label) stays put above it. */
      .widget-type-group .widget-group-contents {
        max-height: 500px;
        overflow-y: auto;
      }
      /* The VOZ tab-title row scrolls horizontally on its own instead of
         clipping titles (e.g. "Lập trình") when the column is too narrow
         to fit every tab. */
      .widget-type-group .widget-header {
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: thin;
      }
      .widget-type-group .widget-header .widget-group-title {
        flex-shrink: 0;
      }
      /* Glance's own mobile breakpoint (max-width: 1190px) also catches
         tablets in landscape/portrait (e.g. iPad Air 5 is 820/1180 CSS px
         either way). Push the real switch-to-mobile point down to 700px,
         and restore the normal desktop layout for anything wider than
         that but still under Glance's 1190px cutoff. */
      @media (min-width: 551px) and (max-width: 1190px) {
        .header-container { display: flex !important; }
        .page-column-small { width: 300px !important; flex-shrink: 0 !important; }
        .page-column { display: block !important; }
        .mobile-navigation, .mobile-navigation-offset { display: none !important; }
      }
      /* Below 550px, stack all columns vertically instead of Glance's
         default single-column tab-switcher (which hid the second column
         behind a tap target on the bottom nav bar). The side column goes
         full-width here too instead of staying pinned at 300px. */
      @media (max-width: 550px) {
        .page-columns { flex-direction: column !important; }
        .page-column, .page-column-small { display: block !important; width: 100% !important; }
        .mobile-navigation-label:has(.mobile-navigation-pill) { display: none !important; }
      }
      /* Desktop-style icon grid for the Launchers widget. */
      .launcher-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
      }
      .launcher-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80px;
        text-align: center;
        gap: 0.35rem;
        text-decoration: none;
      }
      .launcher-tile img {
        width: 40px;
        height: 40px;
        filter: var(--flat-icon-filter, none);
      }
      .launcher-fallback-icon {
        width: 40px;
        height: 40px;
        border-radius: 0.4rem;
        background: var(--color-primary);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .launcher-tile span:last-child {
        font-size: 0.75rem;
        color: var(--color-text-base, inherit);
      }
    </style>
    <script>
      // Fire-and-forget background launch -- no navigation, no new tab.
      // no-cors because the launcher listener sends no CORS headers; we
      // don't need to read the response, just confirm the fetch resolved.
      function glanceLaunch(ev, key) {
        ev.preventDefault();
        var label = ev.currentTarget.querySelector('span:last-child');
        var original = label.textContent;
        // Same-origin through the tunnel when on the public hostname (Access-
        // protected, no mixed content); direct port hit otherwise (Tailscale
        // IP / localhost) -- a hardcoded https:// URL would silently "succeed"
        // via no-cors even if Access just redirected it to a login page.
        var url = location.origin === 'https://homelab.mashallow.cloud'
          ? 'https://homelab.mashallow.cloud/launcher/launch?app=' + key
          : 'http://' + location.hostname + ':8082/launch?app=' + key;
        fetch(url, { mode: 'no-cors' })
          .then(function () { label.textContent = 'Launched'; })
          .catch(function () { label.textContent = 'Error'; })
          .finally(function () { setTimeout(function () { label.textContent = original; }, 1200); });
      }
      // Only exists on Home (VOZ is the only 'group' widget) -- no-op on
      // Project/Config pages. Polls rather than relying on DOMContentLoaded
      // since the group widget's content attaches slightly after that event.
      //
      // IMPORTANT: Glance's own tab-switching JS (setupGroups() in page.js)
      // reads `.widget-header`'s children BY RAW POSITIONAL INDEX and
      // assumes they line up 1:1 with the tab panels. Appending extra
      // children directly into `.widget-header` breaks that indexing and
      // makes every tab click throw mid-handler (clears "current" from all
      // tabs, then crashes before activating the new one -- every tab goes
      // blank). Confirmed by reading Glance's actual source, not guessed.
      // Fix: append a separate row AFTER `.widget-header` (a sibling
      // within `.widget-group-header`, not a child of `.widget-header`
      // itself) instead of absolutely-positioning over it -- an overlay
      // that competes for horizontal space with the tabs breaks again as
      // soon as tab count/label length changes (hit this exact regression
      // once already: 4th tab added, overlay started overlapping "Lập
      // trình"). Its own row below the tabs can never collide.

      // Glance has no per-widget refresh API -- the only thing it exposes
      // is a whole-page content endpoint (the same one it uses for its own
      // initial load: /api/pages/{slug}/content/). A plain location.reload()
      // works but is a full browser navigation (flash, lost scroll
      // position). Instead: fetch that same endpoint, swap each widget's
      // DOM node individually (skipping the clock -- it has its own
      // internal ticking interval closed over its original DOM nodes, and
      // has nothing meaningful to "refresh" anyway), then manually re-run
      // the pieces of Glance's own page.js init that only attach at load
      // time (tab click-handlers, dynamic relative-time text) since a DOM
      // swap wipes whatever event listeners were on the old nodes. These
      // are reimplemented from page.js by hand -- Glance doesn't expose
      // them on window -- so if Glance's markup/behavior ever changes this
      // may need updating to match; falls back to a full reload on any
      // error so a mismatch never leaves the page half-updated.
      function wireGroupTabs() {
        var groups = document.getElementsByClassName('widget-type-group');
        for (var g = 0; g < groups.length; g++) {
          (function (group) {
            var titles = group.getElementsByClassName('widget-header')[0].children;
            var tabs = group.getElementsByClassName('widget-group-contents')[0].children;
            var current = 0;
            for (var t = 0; t < titles.length; t++) {
              (function (title, t) {
                title.addEventListener('click', function () {
                  if (t === current) return;
                  for (var i = 0; i < titles.length; i++) {
                    titles[i].classList.remove('widget-group-title-current');
                    titles[i].setAttribute('aria-selected', 'false');
                    tabs[i].classList.remove('widget-group-content-current');
                    tabs[i].setAttribute('aria-hidden', 'true');
                  }
                  tabs[t].dataset.direction = current < t ? 'right' : 'left';
                  current = t;
                  title.classList.add('widget-group-title-current');
                  title.setAttribute('aria-selected', 'true');
                  tabs[t].classList.add('widget-group-content-current');
                  tabs[t].setAttribute('aria-hidden', 'false');
                });
              })(titles[t], t);
            }
          })(groups[g]);
        }
      }

      function timestampToRelativeTime(timestamp) {
        var minuteInSeconds = 60, hourInSeconds = 3600, dayInSeconds = 86400,
          monthInSeconds = dayInSeconds * 30.4, yearInSeconds = dayInSeconds * 365;
        var delta = Math.round(Date.now() / 1000 - timestamp);
        var prefix = '';
        if (delta < 0) { delta = -delta; prefix = 'in '; }
        if (delta < minuteInSeconds) return prefix + '1m';
        if (delta < hourInSeconds) return prefix + Math.floor(delta / minuteInSeconds) + 'm';
        if (delta < dayInSeconds) return prefix + Math.floor(delta / hourInSeconds) + 'h';
        if (delta < monthInSeconds) return prefix + Math.floor(delta / dayInSeconds) + 'd';
        if (delta < yearInSeconds) return prefix + Math.floor(delta / monthInSeconds) + 'mo';
        return prefix + Math.floor(delta / yearInSeconds) + 'y';
      }

      function refreshDynamicRelativeTime() {
        document.querySelectorAll('[data-dynamic-relative-time]').forEach(function (el) {
          el.textContent = timestampToRelativeTime(el.dataset.dynamicRelativeTime);
        });
      }

      function refreshPageContent(btn) {
        var original = btn.textContent;
        btn.textContent = '⟳...';
        btn.disabled = true;
        fetch(pageData.baseURL + '/api/pages/' + pageData.slug + '/content/')
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var fresh = document.createElement('div');
            fresh.innerHTML = html;
            // Only top-level widgets -- a `group` widget (VOZ) nests one
            // `.widget` per tab internally, which would double-count and
            // break index-matching if selected too.
            var topLevelSelector = ':scope > .page-columns > .page-column > .widget';
            var oldWidgets = document.querySelectorAll('#page-content > .page-columns > .page-column > .widget');
            var newWidgets = fresh.querySelectorAll(topLevelSelector);
            if (oldWidgets.length !== newWidgets.length) throw new Error('widget count mismatch');
            for (var i = 0; i < oldWidgets.length; i++) {
              if (!oldWidgets[i].classList.contains('widget-type-clock')) {
                oldWidgets[i].replaceWith(newWidgets[i]);
              }
            }
            wireGroupTabs();
            refreshDynamicRelativeTime();
            injectReloadUI(40);
          })
          .catch(function () { location.reload(); });
      }

      function injectReloadUI(attemptsLeft) {
        var group = document.querySelector('.widget-type-group');
        var groupHeader = group ? group.querySelector('.widget-group-header') : null;
        if (!groupHeader) {
          if (attemptsLeft > 0) setTimeout(function () { injectReloadUI(attemptsLeft - 1); }, 150);
          return;
        }
        if (document.getElementById('manual-reload-btn')) return;

        var container = document.createElement('div');
        container.style.cssText = 'display:flex; align-items:center; justify-content:flex-end; gap:0.5rem; padding:0.3rem 0;';

        var label = document.createElement('div');
        label.id = 'last-updated-label';
        label.textContent = 'Loaded ' + new Date().toLocaleTimeString();
        container.appendChild(label);

        var btn = document.createElement('button');
        btn.id = 'manual-reload-btn';
        btn.textContent = '⟳';
        btn.title = 'Refresh dashboard data (no page reload)';
        btn.onclick = function () { refreshPageContent(btn); };
        container.appendChild(btn);

        groupHeader.appendChild(container);
      }

      injectReloadUI(40);
    </script>

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: custom-api
            title: Claude Usage
            cache: 1h
            url: https://claude.ai/api/organizations/d1b3b1b0-8de0-46a1-b2e0-45d0ed4ed1f1/usage
            headers:
              Cookie: sessionKey=${readFileFromEnv:CLAUDE_SESSION_KEY_FILE}
              Accept: application/json
              Referer: https://claude.ai/settings/usage
              Origin: https://claude.ai
              User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
            template: |
              <div class="size-h4 color-highlight margin-bottom-10">Plan usage limits</div>
              {{ $printedWeekly := false }}
              {{ range .JSON.Array "limits" }}
              {{ $kind := .String "kind" }}
              {{ $percent := .Int "percent" }}
              {{ $resetsRaw := .String "resets_at" }}
              {{ if and (ne $kind "session") (not $printedWeekly) }}
              <div class="size-h4 color-highlight margin-top-15 margin-bottom-10">Weekly limits</div>
              {{ $printedWeekly = true }}
              {{ end }}
              <div class="margin-bottom-10">
                <div class="flex justify-between items-end size-h5">
                  <div>{{ if eq $kind "session" }}Current session{{ else if eq $kind "weekly_all" }}All models{{ else }}{{ replaceAll "_" " " $kind }}{{ end }}</div>
                  <div class="color-highlight text-very-compact">{{ $percent }} <span class="color-base">%</span></div>
                </div>
                <div class="progress-bar progress-bar-combined">
                  <div class="progress-value{{ if ge $percent 85 }} progress-value-notice{{ end }}" style="--percent: {{ $percent }}"></div>
                </div>
                <div class="size-h6">{{ if ne $resetsRaw "" }}Resets <span {{ toRelativeTime ($resetsRaw | parseTime "rfc3339nano") }}></span>{{ else }}Not currently active{{ end }}</div>
              </div>
              {{ end }}
              {{ if .JSON.Bool "extra_usage.is_enabled" }}
              <div class="size-h4 color-highlight margin-top-15 margin-bottom-10">Usage credits</div>
              <div class="margin-bottom-10">
                <div class="flex justify-between items-end size-h5">
                  <div>{{ .JSON.Float "extra_usage.used_credits" }} spent</div>
                  <div class="color-highlight text-very-compact">{{ .JSON.Int "extra_usage.utilization" }} <span class="color-base">%</span></div>
                </div>
                <div class="progress-bar progress-bar-combined">
                  <div class="progress-value" style="--percent: {{ .JSON.Int "extra_usage.utilization" }}"></div>
                </div>
              </div>
              {{ end }}

          - type: group
            title: VOZ
            widgets:
              - type: rss
                title: All
                limit: 20
                cache: 5m
                feeds:
                  - url: https://voz.vn/f/-/index.rss
                    title: VOZ

              - type: rss
                title: Linh tinh
                limit: 20
                cache: 5m
                feeds:
                  - url: https://voz.vn/f/chuyen-tro-linh-tinh%E2%84%A2.17/index.rss
                    title: Linh tinh

              - type: rss
                title: Điểm báo
                limit: 20
                cache: 5m
                feeds:
                  - url: https://voz.vn/f/diem-bao.33/index.rss
                    title: Điểm báo

              - type: rss
                title: Lập trình
                limit: 20
                cache: 5m
                feeds:
                  - url: https://voz.vn/f/lap-trinh-cntt.91/index.rss
                    title: Lập trình

      - size: full
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Jellyfin
                url: http://100.110.90.117:8096
                icon: si:jellyfin

          - type: bookmarks
            groups:
              - links:
                  - title: Glance GitHub
                    url: https://github.com/glanceapp/glance
                  - title: Grok
                    url: https://grok.com
                  - title: Claude
                    url: https://claude.ai
                    icon: si:anthropic
                  - title: VOZ
                    url: https://voz.vn
              - title: YouTube
                links:
                  - title: The PrimeTime
                    url: https://www.youtube.com/@ThePrimeTimeagen
                    icon: si:youtube
                  - title: Mr Matt Lee
                    url: https://www.youtube.com/@Mr_Matt_Lee
                    icon: si:youtube
                  - title: Fireship
                    url: https://www.youtube.com/@Fireship
                    icon: si:youtube
                  - title: Low Level
                    url: https://www.youtube.com/@LowLevelTV
                    icon: si:youtube

          - type: custom-api
            title: Launchers
            template: |
              <div class="launcher-grid">
                <a href="#" onclick="glanceLaunch(event, 'signal')" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/signal.svg" alt="">
                  <span>Signal</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'telegram')" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/telegram.svg" alt="">
                  <span>Telegram</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'zed')" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/zedindustries.svg" alt="">
                  <span>Zed</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'steam')" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Steam</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'rancher')" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/rancher.svg" alt="">
                  <span>Rancher Desktop</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'moonlight')" class="launcher-tile">
                  <span class="launcher-fallback-icon">M</span>
                  <span>Moonlight</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'cpuz')" class="launcher-tile">
                  <span class="launcher-fallback-icon">C</span>
                  <span>CPU-Z</span>
                </a>
                <a href="#" onclick="glanceLaunch(event, 'uma')" class="launcher-tile">
                  <span class="launcher-fallback-icon">U</span>
                  <span>Uma Musume JP</span>
                </a>
                <a href="steam://rungameid/1017900" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Age of Empires DE</span>
                </a>
                <a href="steam://rungameid/1938090" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Call of Duty</span>
                </a>
                <a href="steam://rungameid/2000950" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Call of Duty MW</span>
                </a>
                <a href="steam://rungameid/3595230" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Call of Duty MW2</span>
                </a>
                <a href="steam://rungameid/3224770" class="launcher-tile">
                  <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/steam.svg" alt="">
                  <span>Umamusume Pretty Derby</span>
                </a>
              </div>

  - name: Project
    columns:
      - size: full
        widgets:
          - type: repository
            title: odysseus-dev/odysseus
            repository: odysseus-dev/odysseus
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5
            cache: 5m

          - type: bookmarks
            groups:
              - title: odysseus-dev/odysseus
                links:
                  - title: Discussions
                    url: https://github.com/odysseus-dev/odysseus/discussions
                    icon: si:github

  - name: Config
    columns:
      - size: full
        widgets:
          - type: iframe
            source: http://100.110.90.117:8081
            height: 700

          - type: repository
            title: glance-config
            repository: TuanKietTran/glance-config
            commits-limit: 5
            cache: 5m

          - type: bookmarks
            groups:
              - links:
                  - title: View glance.yml
                    url: https://github.com/TuanKietTran/glance-config/blob/master/glance.yml
                    icon: si:github
