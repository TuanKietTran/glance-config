<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root {
    --bg: #16181d;
    --bg-widget: #1e2129;
    --bg-widget-hover: #262a33;
    --border: #2a2e37;
    --text: #e4e6eb;
    --text-dim: #8b92a3;
    --primary: #6ea8fe;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  body { overflow-y: auto; }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.2rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-dim); margin: 0; white-space: nowrap; }
  #search-form { flex: 1; display: flex; }
  #search-input {
    flex: 1; background: var(--bg-widget); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.6rem 1rem; color: var(--text);
    font-size: 0.95rem; outline: none;
  }
  #search-input:focus { border-color: var(--primary); }
  main {
    max-width: 1200px; margin: 0 auto; padding: 0 2rem 3rem;
    display: flex; gap: 1.5rem; align-items: flex-start;
  }
  .col-small { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.5rem; }
  .col-full { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.5rem; }
  .widget { background: var(--bg-widget); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; }
  .widget-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 0.9rem; font-weight: 600; }
  #clock { text-align: center; padding: 0.5rem 0 0.2rem; }
  #clock-time { font-size: 2.6rem; font-weight: 300; line-height: 1; letter-spacing: 0.02em; }
  #clock-date { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.4rem; }
  #weather { display: flex; align-items: center; justify-content: space-between; }
  #weather-temp { font-size: 2.2rem; font-weight: 300; }
  #weather-desc { color: var(--text-dim); font-size: 0.85rem; }
  #weather-place { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.2rem; }
  .bookmark-group + .bookmark-group { margin-top: 1rem; }
  .bookmark-group-title { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.4rem; }
  .bookmark-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; }
  .bookmark-list a { display: block; color: var(--text); text-decoration: none; font-size: 0.9rem; padding: 0.35rem 0.5rem; margin: 0 -0.5rem; border-radius: 6px; }
  .bookmark-list a:hover { background: var(--bg-widget-hover); color: var(--primary); }
  .repo-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .repo-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.7rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); gap: 1rem; }
  .repo-name { font-size: 0.9rem; text-decoration: none; color: var(--text); font-weight: 500; }
  .repo-name:hover { color: var(--primary); }
  .repo-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; }
  .repo-stats { display: flex; gap: 0.9rem; font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
  .hn-list, .rss-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
  .hn-list li, .rss-list li { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.88rem; }
  .hn-rank { color: var(--text-dim); width: 1.3rem; flex-shrink: 0; text-align: right; }
  .hn-list a, .rss-list a { color: var(--text); text-decoration: none; }
  .hn-list a:hover, .rss-list a:hover { color: var(--primary); }
  .hn-points { color: var(--text-dim); font-size: 0.78rem; white-space: nowrap; }
  .loading, .error { color: var(--text-dim); font-size: 0.85rem; }
  .error { color: #e88; }
  .tabs { display: flex; gap: 0.3rem; overflow-x: auto; margin-bottom: 0.8rem; scrollbar-width: thin; }
  .tab-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 999px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #16181d; font-weight: 600; }
  .tab-panel { max-height: 420px; overflow-y: auto; }
  .voz-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
  .voz-header-controls { display: flex; align-items: center; gap: 0.5rem; }
  #voz-updated { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }
  .reload-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 0.15rem 0.5rem; font-size: 0.85rem; cursor: pointer; line-height: 1.3; }
  .reload-btn:hover { color: var(--primary); border-color: var(--primary); }
  .reload-btn:disabled { opacity: 0.5; cursor: default; }
  .reload-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (max-width: 780px) {
    main { flex-direction: column; }
    .col-small { width: 100%; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <h1>Home</h1>
  <form id="search-form">
    <input id="search-input" type="text" placeholder="Search the web..." autofocus>
  </form>
</header>

<main>
  <div class="col-small">
    <div class="widget" id="clock">
      <div id="clock-time">--:--</div>
      <div id="clock-date"></div>
    </div>

    <div class="widget">
      <div class="widget-title">Weather</div>
      <div id="weather"><span class="loading">Loading...</span></div>
    </div>

    <div class="widget">
      <div class="widget-title">Bookmarks</div>
      <div class="bookmark-group">
        <ul class="bookmark-list">
          <li><a href="https://mail.google.com" target="_blank" rel="noopener">Gmail</a></li>
          <li><a href="https://calendar.google.com" target="_blank" rel="noopener">Calendar</a></li>
          <li><a href="https://drive.google.com" target="_blank" rel="noopener">Drive</a></li>
          <li><a href="https://claude.ai" target="_blank" rel="noopener">Claude</a></li>
          <li><a href="https://github.com" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </div>
      <div class="bookmark-group">
        <div class="bookmark-group-title">Reference</div>
        <ul class="bookmark-list">
          <li><a href="https://github.com/glanceapp/glance" target="_blank" rel="noopener">Glance (source)</a></li>
          <li><a href="https://github.com/TuanKietTran/glance-config/blob/master/glance.yml" target="_blank" rel="noopener">Original glance.yml (adapted from)</a></li>
        </ul>
      </div>
    </div>

    <div class="widget">
      <div class="voz-header-row">
        <div class="widget-title" style="margin:0;">VOZ</div>
        <div class="voz-header-controls">
          <span id="voz-updated"></span>
          <button id="voz-reload" class="reload-btn" title="Refresh this tab">⟳</button>
        </div>
      </div>
      <div class="tabs" id="voz-tabs"></div>
      <div class="tab-panel"><ul class="rss-list" id="voz-content"><li><span class="loading">Loading...</span></li></ul></div>
    </div>
  </div>

  <div class="col-full">
    <div class="widget">
      <div class="widget-title">Watched repos</div>
      <div class="repo-list" id="repos"><span class="loading">Loading...</span></div>
    </div>

    <div class="widget">
      <div class="widget-title">Hacker News — front page</div>
      <ul class="hn-list" id="hn"><li><span class="loading">Loading...</span></li></ul>
    </div>
  </div>
</main>

<script src="newtab.js"></script>
</body>
</html>
