<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/JetBrainsMono-Regular.woff2') format('woff2');
  }
  :root {
    /* values pulled from glanceapp/glance's own default theme (main.css :root) */
    --color-background: hsl(240, 8%, 9%);
    --color-widget-background: hsl(240, 8%, 10%);
    --color-widget-shadow: hsl(240, 8%, 8.5%);
    --color-widget-border: hsl(240, 8%, 13%);
    --color-popover-border: hsl(240, 8%, 21%);
    --color-text-highlight: hsl(240, 8%, 85%);
    --color-text-paragraph: hsl(240, 8%, 73%);
    --color-text-base: hsl(240, 8%, 58%);
    --color-text-base-muted: hsl(240, 8%, 52%);
    --color-text-subdue: hsl(240, 8%, 35%);
    --color-primary: hsl(43, 50%, 70%);
    --color-negative: hsl(0, 70%, 70%);
    --border-radius: 5px;
    --widget-gap: 23px;
    --font-size-h3: 1.5rem;
    --font-size-h4: 1.4rem;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--color-background);
    color: var(--color-text-base);
    font-family: 'JetBrains Mono', monospace;
    height: 100%;
  }
  body { overflow-y: auto; }
  a { text-decoration: none; color: inherit; }
  ::-webkit-scrollbar { background: var(--color-background); height: 5px; width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--color-text-subdue); border-radius: var(--border-radius); }
  ::selection { background: hsl(240, 8%, 29%); color: var(--color-text-highlight); }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: var(--widget-gap) 2rem 0;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 {
    font-size: var(--font-size-h4);
    font-weight: 400;
    color: var(--color-text-subdue);
    margin: 0;
    white-space: nowrap;
    border-right: 1px solid var(--color-widget-border);
    padding-right: 1.2rem;
  }
  #search-form {
    flex: 1; display: flex;
    background: var(--color-widget-background);
    border: 1px solid var(--color-widget-border);
    border-radius: var(--border-radius);
    box-shadow: 0px 3px 0px 0px var(--color-widget-shadow);
  }
  #search-input {
    flex: 1; border: 0; background: none;
    padding: 0.65rem 1rem; color: var(--color-text-highlight);
    font: inherit; font-size: 0.95rem; outline: none;
  }
  #search-input::placeholder { color: var(--color-text-subdue); }

  main {
    max-width: 1200px; margin: 0 auto; padding: 0 2rem calc(var(--widget-gap) * 2);
    display: flex; gap: var(--widget-gap); align-items: flex-start;
  }
  .col-small { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: var(--widget-gap); margin-top: var(--widget-gap); }
  .col-full { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--widget-gap); margin-top: var(--widget-gap); }
  .widget {
    background: var(--color-widget-background);
    border: 1px solid var(--color-widget-border);
    border-radius: var(--border-radius);
    box-shadow: 0px 3px 0px 0px var(--color-widget-shadow);
    padding: 1.1rem 1.2rem;
  }
  .widget-title {
    font-size: var(--font-size-h4);
    font-weight: 400;
    color: var(--color-text-highlight);
    margin: 0 0 0.9rem;
  }
  #clock { text-align: center; padding: 0.5rem 0 0.2rem; }
  #clock-time { font-size: 2.6rem; font-weight: 400; line-height: 1; color: var(--color-text-highlight); }
  #clock-date { color: var(--color-text-subdue); font-size: 0.85rem; margin-top: 0.4rem; }
  #weather { display: flex; align-items: center; justify-content: space-between; }
  #weather-temp { font-size: 2.2rem; font-weight: 400; color: var(--color-text-highlight); }
  #weather-desc { color: var(--color-text-subdue); font-size: 0.85rem; }
  #weather-place { font-size: 0.8rem; color: var(--color-text-subdue); margin-top: 0.2rem; }
  .bookmark-group + .bookmark-group { margin-top: 1rem; }
  .bookmark-group-title { font-size: 0.8rem; color: var(--color-text-subdue); text-transform: uppercase; margin-bottom: 0.4rem; }
  .bookmark-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; }
  .bookmark-list a { display: block; color: var(--color-text-base); font-size: 0.9rem; padding: 0.35rem 0.5rem; margin: 0 -0.5rem; border-radius: var(--border-radius); transition: color .3s, background .3s; }
  .bookmark-list a:hover { background: hsl(240, 8%, 13%); color: var(--color-primary); }
  .repo-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .repo-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.7rem; border-radius: var(--border-radius); background: var(--color-background); border: 1px solid var(--color-widget-border); gap: 1rem; }
  .repo-name { font-size: 0.9rem; color: var(--color-text-paragraph); font-weight: 400; transition: color .3s; }
  .repo-name:hover { color: var(--color-primary); }
  .repo-desc { font-size: 0.78rem; color: var(--color-text-subdue); margin-top: 0.15rem; }
  .repo-stats { display: flex; gap: 0.9rem; font-size: 0.8rem; color: var(--color-text-subdue); white-space: nowrap; }
  .hn-list, .rss-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
  .hn-list li, .rss-list li { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.88rem; }
  .hn-rank { color: var(--color-text-subdue); width: 1.3rem; flex-shrink: 0; text-align: right; }
  .hn-list a, .rss-list a { color: var(--color-text-paragraph); transition: color .3s; }
  .hn-list a:hover, .rss-list a:hover { color: var(--color-primary); }
  .hn-points { color: var(--color-text-subdue); font-size: 0.78rem; white-space: nowrap; }
  .loading, .error { color: var(--color-text-subdue); font-size: 0.85rem; }
  .error { color: var(--color-negative); }

  /* tab style matches glance's widget-group.css: underline-on-active text tabs, not pills */
  .tabs { display: flex; gap: 1.1rem; overflow-x: auto; margin-bottom: 0.9rem; scrollbar-width: thin; text-transform: uppercase; font-size: 0.78rem; }
  .tab-btn {
    background: none; border: none; font: inherit; font-size: inherit;
    color: var(--color-text-subdue); cursor: pointer; flex-shrink: 0; white-space: nowrap;
    border-bottom: 1px dotted transparent; padding-bottom: 3px; line-height: 1.6em;
    transition: color .3s, border-color .3s;
  }
  .tab-btn:hover:not(.active) { color: var(--color-text-base); }
  .tab-btn.active { border-bottom: 1px solid var(--color-text-base-muted); color: var(--color-text-base); }
  .tab-panel { max-height: 420px; overflow-y: auto; }
  .voz-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
  .voz-header-controls { display: flex; align-items: center; gap: 0.6rem; }
  #voz-updated { font-size: 0.7rem; color: var(--color-text-subdue); white-space: nowrap; }
  .reload-btn {
    background: none; border: 0; color: var(--color-text-subdue);
    font: inherit; font-size: 0.95rem; cursor: pointer; line-height: 1;
    transition: color .3s;
  }
  .reload-btn:hover { color: var(--color-primary); }
  .reload-btn:disabled { opacity: 0.5; cursor: default; }
  .reload-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (max-width: 780px) {
    main { flex-direction: column; }
    .col-small { width: 100%; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <h1>Home</h1>
  <form id="search-form">
    <input id="search-input" type="text" placeholder="Search the web..." autofocus>
  </form>
</header>

<main>
  <div class="col-small">
    <div class="widget" id="clock">
      <div id="clock-time">--:--</div>
      <div id="clock-date"></div>
    </div>

    <div class="widget">
      <div class="widget-title">Weather</div>
      <div id="weather"><span class="loading">Loading...</span></div>
    </div>

    <div class="widget">
      <div class="widget-title">Bookmarks</div>
      <div class="bookmark-group">
        <ul class="bookmark-list">
          <li><a href="https://mail.google.com" target="_blank" rel="noopener">Gmail</a></li>
          <li><a href="https://calendar.google.com" target="_blank" rel="noopener">Calendar</a></li>
          <li><a href="https://drive.google.com" target="_blank" rel="noopener">Drive</a></li>
          <li><a href="https://claude.ai" target="_blank" rel="noopener">Claude</a></li>
          <li><a href="https://github.com" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </div>
      <div class="bookmark-group">
        <div class="bookmark-group-title">Reference</div>
        <ul class="bookmark-list">
          <li><a href="https://github.com/glanceapp/glance" target="_blank" rel="noopener">Glance (source)</a></li>
          <li><a href="https://github.com/TuanKietTran/glance-config/blob/master/glance.yml" target="_blank" rel="noopener">Original glance.yml (adapted from)</a></li>
        </ul>
      </div>
    </div>

    <div class="widget">
      <div class="voz-header-row">
        <div class="widget-title" style="margin:0;">VOZ</div>
        <div class="voz-header-controls">
          <span id="voz-updated"></span>
          <button id="voz-reload" class="reload-btn" title="Refresh this tab">⟳</button>
        </div>
      </div>
      <div class="tabs" id="voz-tabs"></div>
      <div class="tab-panel"><ul class="rss-list" id="voz-content"><li><span class="loading">Loading...</span></li></ul></div>
    </div>
  </div>

  <div class="col-full">
    <div class="widget">
      <div class="widget-title">Watched repos</div>
      <div class="repo-list" id="repos"><span class="loading">Loading...</span></div>
    </div>

    <div class="widget">
      <div class="widget-title">Hacker News — front page</div>
      <ul class="hn-list" id="hn"><li><span class="loading">Loading...</span></li></ul>
    </div>
  </div>
</main>

<script src="newtab.js"></script>
</body>
</html>
